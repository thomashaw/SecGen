<!doctype html>
<!-- DEV ONLY: generated by backups_lab_rework/build_verify_page.sh from VERIFY_WALKTHROUGH.md. Remove before merge. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backups Lab Verification</title>
<style>
  :root { --bg:#fff; --fg:#1d1f23; --muted:#5d6470; --line:#d9dde3; --code-bg:#f3f5f8; --accent:#1d5fbf; --bar:#f8f9fb; --ok:#1d7a3e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181c; --fg:#e4e6ea; --muted:#a2a8b3; --line:#30343b; --code-bg:#1f2228; --accent:#7fb0ff; --bar:#1b1e23; --ok:#5fd18b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--bar); border-bottom:1px solid var(--line); padding:10px 16px; }
  header .row { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; max-width:1000px; margin:0 auto; }
  header label { font-size:13px; color:var(--muted); display:flex; gap:6px; align-items:center; }
  header input { font:14px ui-monospace, Menlo, monospace; padding:4px 6px; width:12em; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:4px; }
  header .ver { font-size:12px; color:var(--muted); margin-left:auto; }
  main { max-width:1000px; margin:0 auto; padding:8px 16px 80px; }
  h1 { font-size:1.6em; } h2 { margin-top:2em; border-bottom:1px solid var(--line); padding-bottom:4px; } h3 { margin-top:1.6em; }
  a { color:var(--accent); }
  code { font:0.9em ui-monospace, Menlo, Consolas, monospace; background:var(--code-bg); padding:1px 4px; border-radius:3px; }
  pre { position:relative; background:var(--code-bg); border:1px solid var(--line); border-radius:6px; padding:12px 14px; overflow-x:auto; }
  pre code { background:none; padding:0; font-size:13.5px; line-height:1.5; }
  pre .copy { position:absolute; top:6px; right:6px; font:12px system-ui, sans-serif; padding:3px 9px; border:1px solid var(--line); border-radius:4px; background:var(--bg); color:var(--fg); cursor:pointer; }
  pre .copy.done { color:var(--ok); border-color:var(--ok); }
  table { border-collapse:collapse; display:block; overflow-x:auto; margin:1em 0; }
  th, td { border:1px solid var(--line); padding:5px 9px; text-align:left; vertical-align:top; }
  blockquote { margin:1em 0; padding:4px 14px; border-left:3px solid var(--accent); color:var(--muted); }
  li { margin:4px 0; }
  li > input[type=checkbox] { transform:scale(1.25); margin-right:6px; cursor:pointer; }
  .subst { outline:1px dashed var(--accent); outline-offset:1px; border-radius:2px; }
</style>
</head>
<body>
<header>
  <div class="row">
    <label>YOURUSER <input data-ph="YOURUSER" placeholder="whoami"></label>
    <label>SECONDUSER <input data-ph="SECONDUSER" placeholder="ls /home"></label>
    <label>BACKUPIP <input data-ph="BACKUPIP" placeholder="backup_server IP"></label>
    <span class="ver">DEV page · <!--VERSION--></span>
  </div>
</header>
<main>
<!--BODY-->
</main>
<script>
(function () {
  var KEY = 'backups-verify:';
  function load(k) { try { return localStorage.getItem(KEY + k); } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem(KEY + k, v); } catch (e) {} }

  // Placeholder substitution in code (skip the placeholder legend table so it still reads as a legend).
  var inputs = Array.prototype.slice.call(document.querySelectorAll('header input[data-ph]'));
  var codes = Array.prototype.slice.call(document.querySelectorAll('main code')).filter(function (c) { return !c.closest('table'); });
  codes.forEach(function (c) { c.dataset.orig = c.textContent; });
  function apply() {
    var vals = {};
    inputs.forEach(function (i) { vals[i.dataset.ph] = i.value.trim(); save(i.dataset.ph, i.value); });
    codes.forEach(function (c) {
      var t = c.dataset.orig, changed = false;
      Object.keys(vals).forEach(function (ph) {
        if (vals[ph] && t.indexOf(ph) !== -1) { t = t.split(ph).join(vals[ph]); changed = true; }
      });
      c.textContent = t;
      c.classList.toggle('subst', changed && !c.closest('pre'));
    });
  }
  inputs.forEach(function (i) { var v = load(i.dataset.ph); if (v) i.value = v; i.addEventListener('input', apply); });
  apply();

  // Copy buttons. navigator.clipboard needs a secure context (https/localhost); this page is plain
  // http://hackerbot:8080, so fall back to a hidden textarea + execCommand('copy').
  function copyText(text, done) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, function () { legacy(text) && done(); });
    } else if (legacy(text)) { done(); }
  }
  function legacy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta); return ok;
  }
  document.querySelectorAll('main pre').forEach(function (pre) {
    var b = document.createElement('button');
    b.className = 'copy'; b.type = 'button'; b.textContent = 'Copy';
    b.addEventListener('click', function () {
      copyText(pre.querySelector('code').textContent.replace(/\n+$/, '') + '\n', function () {
        b.textContent = 'Copied'; b.classList.add('done');
        setTimeout(function () { b.textContent = 'Copy'; b.classList.remove('done'); }, 1200);
      });
    });
    pre.appendChild(b);
  });

  // Task-list checkboxes: pandoc renders them disabled; make them clickable and remember them.
  document.querySelectorAll('main li > input[type=checkbox]').forEach(function (cb, n) {
    cb.disabled = false;
    cb.checked = load('cb' + n) === '1';
    cb.addEventListener('change', function () { save('cb' + n, cb.checked ? '1' : '0'); });
  });
})();
</script>
</body>
</html>
