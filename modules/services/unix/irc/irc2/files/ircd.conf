# ircd-irc2 configuration (fields are %-separated, as used by Debian's ircd-irc2)

# M-Line: server info
M%irc.localhost%%Fast IRC Server%%000A

# A-Line: admin info
A%Fast IRC Server%Local testing server%admin@localhost%%LocalNet

# Y-Lines: connection classes (class%ping freq%connect freq%max links%sendq)
Y%1%90%%100%512000%5.5%100.100
Y%2%90%%300%512000%5.5%250.250

# I-Lines: allow all clients
I%*%%%0%1
I%127.0.0.1/32%%%0%1

# P-Line: listen on port 6667
P%%%%6667%
